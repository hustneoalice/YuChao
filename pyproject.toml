[project]
name = "yuchao"
version = "0.1.0"
description = "YuChao 驭潮 — AI 问股数据底座：契约化行情 API（OpenAPI 驱动，前端可整体替换）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "YuChao Contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "holidays>=0.50",
    "pyjwt>=2.8",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.21"]
# 复权因子源（可选：缺失时任务 skipped，不影响其余链路）
baostock = ["baostock>=0.8.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
