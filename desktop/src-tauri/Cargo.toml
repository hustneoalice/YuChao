[package]
name = "yuchao-desktop"
version = "1.2.0"
description = "驭潮 YuChao 桌面壳"
authors = ["neoix"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yuchao_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
